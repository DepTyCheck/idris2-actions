name: Build and test

on:
  workflow_call:
    inputs:
      ipkg_path:
        description: Path to the .ipkg to build and test. By default expects .ipkg in repo root.
        required: false
        type: string
        default: ""
      container_tag:
        description: Tag for the ghcr.io/stefan-hoeck/idris2-pack container.
        required: false
        type: string
        default: latest
      pack_collections:
        description: JSON array of pack collections to build, e.g. ["latest"] or ["latest", "HEAD"]. Empty array keeps the automatic latest/HEAD selection.
        required: false
        type: string
        default: "[]"
      run_tests:
        description: Run `pack test` after building. Set false to only build and cache.
        required: false
        type: boolean
        default: true
      pack_deps:
        description: Space-separated pack libraries to `pack install` before `pack build`.
        required: false
        type: string
        default: ""
      pack_extras:
        description: Space-separated pack libraries to `pack install` after `pack build`.
        required: false
        type: string
        default: ""
      pre_build:
        description: Bash script to run before `pack build`.
        required: false
        type: string
        default: ""
      pre_test:
        description: Bash script to run before `pack test`.
        required: false
        type: string
        default: ""
      enable_cache:
        description: Tar the pack state and build dir after building and upload them as artifacts to restore pack state in other jobs.
        required: false
        type: boolean
        default: true
    outputs:
      collections:
        description: JSON array of pack collection names.
        value: ${{ jobs.get-upstream-matrix.outputs.collections }}
      pack_states:
        description: JSON array of restore handles, one per pack collection.
        value: ${{ jobs.get-upstream-matrix.outputs.pack_states }}
      pack_state:
        description: Alias for pack_states[0]; empty if pack_states is empty.
        value: ${{ jobs.get-upstream-matrix.outputs.pack_state }}
      package:
        description: The package name parsed from the .ipkg.
        value: ${{ jobs.get-upstream-matrix.outputs.package }}
      project_dir:
        description: Directory holding the .ipkg and pack.toml.
        value: ${{ jobs.get-upstream-matrix.outputs.project_dir }}
      build_dir:
        description: The package's build dir (relative to project_dir).
        value: ${{ jobs.get-upstream-matrix.outputs.build_dir }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.ipkg_path }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  get-upstream-matrix:
    name: Prepare pack states
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:${{ inputs.container_tag }}
    outputs:
      collections: ${{ steps.matrix.outputs.collections }}
      pack_states: ${{ steps.matrix.outputs.pack_states }}
      pack_state: ${{ steps.matrix.outputs.pack_state }}
      # test_matrix includes two lists: pack states and collections.
      # Collection is used only in the name; pack state is the cache key to upload and restore pack state
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
      package: ${{ steps.matrix.outputs.package }}
      project_dir: ${{ steps.matrix.outputs.project_dir }}
      build_dir: ${{ steps.matrix.outputs.build_dir }}
      # SHA-256 of the package sources: the .ipkg, src/ if it exists, and pack.toml if it exists
      hash: ${{ steps.matrix.outputs.hash }}
      upstream: ${{ steps.matrix.outputs.upstream }}
      # SHA-256 of [idris2] url + commit from local pack.toml if it exists
      compiler_hash: ${{ steps.matrix.outputs.compiler_hash }}
    steps:
      - name: Install git and TOML parser
        run: apt-get update && apt-get install -y git yq

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Find the package .ipkg
        env:
          IPKG_PATH: ${{ inputs.ipkg_path }}
        run: |
          ipkg="$IPKG_PATH"

          if [ -n "$ipkg" ]; then
            echo "Using provided ipkg_path: $ipkg"
          else
            mapfile -t root_ipkgs < <(find . -maxdepth 1 -name '*.ipkg' -type f)

            case ${#root_ipkgs[@]} in
              0)
                echo "error: no .ipkg found in repo root; set ipkg_path"
                exit 1
                ;;
              1)
                ipkg="${root_ipkgs[0]}"
                ;;
              *)
                echo "error: multiple .ipkg found in repo root; set ipkg_path to pick one:"
                printf '  %s\n' "${root_ipkgs[@]}"
                exit 1
                ;;
            esac
          fi

          if [ ! -f "$ipkg" ]; then
            echo "error: ipkg not found: $ipkg"
            exit 1
          fi

          {
            echo "IPKG=$ipkg"
            echo "PROJECT_DIR=$(dirname "$ipkg")"
          } >> "$GITHUB_ENV"

      - name: Parse package name and build dir
        run: |
          package=$(awk '/^[[:space:]]*package[[:space:]]/ {print $2; exit}' "$IPKG")

          builddir_line=$(awk '/^[[:space:]]*builddir[[:space:]]*=/ {print; exit}' "$IPKG") # find the line
          build_dir="${builddir_line#*=}"           # get the path
          build_dir="${build_dir//[\"[:space:]]/}"  # strip quotes
          build_dir="${build_dir:-build}"           # set default `build`

          echo "Package '$package', build dir '$build_dir'"
          {
            echo "PACKAGE=$package"
            echo "BUILD_DIR=$build_dir"
          } >> "$GITHUB_ENV"

      - name: Hash sources for the cache key
        run: |
          # Hash of the package's sources
          # from https://stackoverflow.com/q/545387
          paths=("$IPKG")
          [ ! -d "$PROJECT_DIR/src" ] || paths+=("$PROJECT_DIR/src")
          [ ! -f "$PROJECT_DIR/pack.toml" ] || paths+=("$PROJECT_DIR/pack.toml")
          hash=$(find "${paths[@]}" -type f -print0 \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16)

          echo "Source hash: $hash"
          echo "HASH=$hash" >> "$GITHUB_ENV"

      - name: Compute build collections
        id: matrix
        env:
          PACK_COLLECTIONS: ${{ inputs.pack_collections }}
        run: |
          custom_compiler=false
          compiler_hash=""
          if [ -f "$PROJECT_DIR/pack.toml" ]; then
            custom_compiler=$(tomlq -r '(.idris2 // {}) | has("url") or has("commit")' "$PROJECT_DIR/pack.toml")
          fi
          if [ "$custom_compiler" = true ]; then
            compiler_hash=$(tomlq -c '[.idris2.url // "", .idris2.commit // ""]' "$PROJECT_DIR/pack.toml" | sha256sum | cut -c1-16)
          fi
          collections=$(jq -c . <<< "$PACK_COLLECTIONS")

          upstream=""
          if [ "$custom_compiler" = true ] && jq -e 'index("HEAD") != null' <<< "$collections" > /dev/null; then
            echo "error: HEAD cannot be combined with a custom compiler in pack.toml" >&2
            exit 1
          fi

          if [ "$collections" != '[]' ]; then
            echo "Using requested collections: $collections"
          elif [ "$custom_compiler" = true ]; then
            collections='["latest"]'
          else
            current=$(idris2 --version | sed 's/.*-//')
            upstream=$(git ls-remote https://github.com/idris-lang/Idris2 main | cut -c1-9)
            echo "Current: $current, bleeding edge: $upstream"
            if [ "$current" = "$upstream" ]; then
              collections='["latest"]'
            else
              collections='["latest","HEAD"]'
            fi
          fi

          pack_states=$(jq -c --arg package "$PACKAGE" --arg suffix "${compiler_hash:+-$compiler_hash}" 'map("pack-state-" + $package + "-" + . + $suffix)' <<< "$collections")
          pack_state=$(jq -r '.[0]' <<< "$pack_states")
          test_matrix=$(jq -c --argjson pack_states "$pack_states" '[., $pack_states] | transpose | map({collection: .[0], state: .[1]})' <<< "$collections")
          echo "Collections: $collections; custom compiler: $custom_compiler"
          echo "Pack states: $pack_states"
          {
            echo "package=$PACKAGE"
            echo "project_dir=$PROJECT_DIR"
            echo "build_dir=$BUILD_DIR"
            echo "collections=$collections"
            echo "pack_states=$pack_states"
            echo "pack_state=$pack_state"
            echo "test_matrix=$test_matrix"
            echo "hash=$HASH"
            echo "upstream=$upstream"
            echo "compiler_hash=$compiler_hash"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.get-upstream-matrix.outputs.package }} (${{ matrix.collection }})
    needs: get-upstream-matrix
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:${{ inputs.container_tag }}
    outputs: # Pass the upstream values down to the test step
      package: ${{ needs.get-upstream-matrix.outputs.package }}
      test_matrix: ${{ needs.get-upstream-matrix.outputs.test_matrix }}
      project_dir: ${{ needs.get-upstream-matrix.outputs.project_dir }}
    env:
      PROJECT_DIR: ${{ needs.get-upstream-matrix.outputs.project_dir }}
      BUILD_DIR: ${{ needs.get-upstream-matrix.outputs.build_dir }}
      HASH: ${{ needs.get-upstream-matrix.outputs.hash }}
      UPSTREAM: ${{ needs.get-upstream-matrix.outputs.upstream }}
      COMPILER_HASH: ${{ needs.get-upstream-matrix.outputs.compiler_hash }}
    strategy:
      fail-fast: false
      matrix:
        collection: ${{ fromJSON(needs.get-upstream-matrix.outputs.collections) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pack directories
        run: |
          {
            echo "PACK_USER_DIR=${PACK_USER_DIR:-${XDG_CONFIG_HOME:-$HOME/.config}/pack}"
            echo "PACK_STATE_DIR=${PACK_STATE_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/pack}"
            echo "PACK_CACHE_DIR=${PACK_CACHE_DIR:-${XDG_CACHE_HOME:-$HOME/.cache}/pack}"
            echo "PACK_BIN_DIR=${PACK_BIN_DIR:-$HOME/.local/bin}"
          } >> "$GITHUB_ENV"

      - name: Update pack database
        working-directory: ${{ env.PROJECT_DIR }}
        run: pack update-db

      - name: Compute cache key with pack state
        id: cache-key
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          COLLECTION: ${{ matrix.collection }}
          CONTAINER_TAG: ${{ inputs.container_tag }}
        run: |
          effective_collection="$COLLECTION"
          if [ "$COLLECTION" = latest ]; then
            # Match pack's latestCollection without installing a compiler.
            effective_collection=$(find "$PACK_STATE_DIR/db" -maxdepth 1 -name '*.toml' ! -name HEAD.toml -exec basename {} .toml \; | LC_ALL=C sort | tail -n 1)
            effective_collection="${effective_collection:-HEAD}"
          fi
          collection_db="$PACK_STATE_DIR/db/$effective_collection.toml"
          pack_hash=$(sha256sum "$collection_db" | cut -c1-16)
          compiler_version=""
          if [ "$COLLECTION" = HEAD ]; then
            compiler_version="${UPSTREAM:-$(git ls-remote https://github.com/idris-lang/Idris2 main | cut -c1-9)}"
          fi
          {
            echo "EFFECTIVE_COLLECTION=$effective_collection"
            echo "PACK_COLLECTION_DB=$collection_db"
            echo "CACHE_KEY=build-state-v2-$CONTAINER_TAG-$HASH-$COLLECTION-$effective_collection-$pack_hash${compiler_version:+-$compiler_version}${COMPILER_HASH:+-$COMPILER_HASH}"
          } >> "$GITHUB_ENV"
          {
            echo 'cache_paths<<EOF'
            printf '%s\n' "$PWD/$BUILD_DIR" "$PACK_USER_DIR" "$PACK_STATE_DIR" "$PACK_CACHE_DIR" "$PACK_BIN_DIR"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache-key.outputs.cache_paths }}
          key: ${{ env.CACHE_KEY }}

      - name: Switch to the bleeding edge compiler
        if: matrix.collection == 'HEAD'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          { echo; echo "[idris2]"; echo 'commit = "latest:main"'; } >> pack.toml
          pack fetch

      - name: Switch collection
        working-directory: ${{ env.PROJECT_DIR }}
        run: pack switch "$EFFECTIVE_COLLECTION"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PACKAGE: ${{ needs.get-upstream-matrix.outputs.package }}
        run: pack install-deps "$PACKAGE"

      - name: Refresh cached file timestamps
        if: steps.cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find "$BUILD_DIR" -type f -exec touch {} +
          sync

      - name: Install pack deps
        if: ${{ inputs.pack_deps != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PACK_DEPS: ${{ inputs.pack_deps }}
        run: |
          # shellcheck disable=SC2086 # intentional word splitting of space-separated libs
          pack install $PACK_DEPS

      - name: Run pre-build script
        if: ${{ inputs.pre_build != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PRE_BUILD: ${{ inputs.pre_build }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build ${{ needs.get-upstream-matrix.outputs.package }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PACKAGE: ${{ needs.get-upstream-matrix.outputs.package }}
        run: pack build "$PACKAGE"

      - name: Install pack extras
        if: ${{ inputs.pack_extras != '' }}
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          PACK_EXTRAS: ${{ inputs.pack_extras }}
        run: |
          # shellcheck disable=SC2086 # intentional word splitting of space-separated libs
          pack install $PACK_EXTRAS

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache-key.outputs.cache_paths }}
          key: ${{ env.CACHE_KEY }}

      - name: Upload pack state and build dir
        if: ${{ inputs.enable_cache || inputs.run_tests }}
        uses: DepTyCheck/idris2-actions/.github/actions/upload-pack-state@v1
        with:
          package: ${{ needs.get-upstream-matrix.outputs.package }}
          collection: ${{ matrix.collection }}
          label: ${{ env.COMPILER_HASH }}
          project_dir: ${{ env.PROJECT_DIR }}
          build_dir: ${{ env.BUILD_DIR }}

  test:
    name: Test ${{ needs.build.outputs.package }} (${{ matrix.collection }})
    needs: build
    if: ${{ !cancelled() && inputs.run_tests }}
    runs-on: ubuntu-latest
    container: ghcr.io/stefan-hoeck/idris2-pack:${{ inputs.container_tag }}
    # jscpd:ignore-start
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # jscpd:ignore-end

      - name: Restore the cached build
        id: restore
        continue-on-error: true
        uses: DepTyCheck/idris2-actions/.github/actions/restore-pack-state@v1
        with:
          state: ${{ matrix.state }}

      - name: Require a pack state from Build
        if: ${{ steps.restore.outcome != 'success' }}
        run: |
          echo "::error::The Build job for this pack state failed, so tests were skipped."
          exit 1

      - name: Run pre-test script
        if: ${{ inputs.pre_test != '' }}
        working-directory: ${{ needs.build.outputs.project_dir }}
        env:
          PRE_TEST: ${{ inputs.pre_test }}
        run: bash -euo pipefail -c "$PRE_TEST"

      - name: Test ${{ needs.build.outputs.package }}
        working-directory: ${{ needs.build.outputs.project_dir }}
        env:
          PACKAGE: ${{ needs.build.outputs.package }}
        run: pack test "$PACKAGE"
