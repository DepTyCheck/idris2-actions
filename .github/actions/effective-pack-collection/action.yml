name: Calculate effective pack collections
description: Resolve requested pack collections and their DB paths without switching pack state.

inputs:
  collections:
    description: JSON array of requested collection names, e.g. ["latest", "HEAD"].
    required: true

outputs:
  resolved_collections:
    description: JSON array of collection, effective_collection, pack_collection_db, and pack_hash objects.
    value: ${{ steps.calc.outputs.resolved_collections }}

runs:
  using: composite
  steps:
    - name: Calculate effective pack collections
      id: calc
      shell: bash
      env:
        COLLECTIONS: ${{ inputs.collections }}
      run: |
        jq -e 'type == "array" and all(.[];
          type == "string" and length > 0 and . != "." and . != ".."
          and (test("[/[:cntrl:]]") | not))' <<< "$COLLECTIONS" > /dev/null

        db="${PACK_STATE_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/pack}/db"
        test -d "$db"
        resolved=$(
          jq -r '.[]' <<< "$COLLECTIONS" | while IFS= read -r collection; do
            effective="$collection"
            if [ "$collection" = latest ]; then
              effective=$(find "$db" -maxdepth 1 -name '*.toml' ! -name HEAD.toml -exec basename {} .toml \; | LC_ALL=C sort | tail -n 1)
              effective="${effective:-HEAD}"
            fi

            file="$db/$effective.toml"
            if [ ! -f "$file" ]; then
              echo "error: collection DB unavailable: $file" >&2
              exit 1
            fi
            hash=$(sha256sum < "$file") || exit 1
            jq -cn --arg collection "$collection" --arg effective "$effective" \
              --arg file "$file" --arg hash "${hash:0:16}" \
              '{collection:$collection, effective_collection:$effective, pack_collection_db:$file, pack_hash:$hash}'
          done | jq -sc .
        )
        echo "resolved_collections=$resolved" >> "$GITHUB_OUTPUT"
